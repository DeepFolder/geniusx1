  <body>
    <div id="root"></div>
    <script>
      // Apply the saved Genius X1 theme before React paints to avoid a flash.
      (function () {
        try {
          if (localStorage.getItem("genius-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
